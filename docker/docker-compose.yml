services:
  sigidb:
    image: postgres:18-alpine
    volumes:
      - ../volumes/db:/var/lib/postgresql/data
    environment:
      - LANG=pt_BR.UTF-8
      - POSTGRES_NAME=sigi
      - POSTGRES_USER=sigi
      - POSTGRES_PASSWORD=sigi
      - PGDATA=/var/lib/postgresql/data
    networks:
      - sigi-net
  sigi:
    build:
      context: ${PWD}/
      dockerfile: docker/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ../volumes/media:/srv/interlegis/sigi/media
    environment:
      - LANG=pt_BR.UTF-8
      - DATABASE_URL=psql://sigi:sigi@sigidb:5432/sigi
      - DEBUG=True
    depends_on:
      - sigidb
    networks:
      - sigi-net
networks:
  sigi-net:
    name: sigi-net
    driver: bridge
